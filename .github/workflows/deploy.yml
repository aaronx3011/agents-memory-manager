name: Deploy memory

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [development, production]
        default: development

permissions:
  contents: read

concurrency:
  group: memory-ship-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  ship:
    needs: verify
    # Initial publication can run CI before this new repository has a VPN runner/settings.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, dev-runner]
    environment: ${{ inputs.environment || 'development' }}
    timeout-minutes: 30
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'development' }}
      RELEASE_SHA: ${{ github.sha }}
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_HEALTH_URL: ${{ vars.DEV_HEALTH_URL }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_PUBLIC_HOST: ${{ vars.PROD_PUBLIC_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate selected target and prepare private SSH state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then
            HOST="$PROD_HOST"; SSH_USER="$PROD_SSH_USER"; KEY="$PROD_SSH_KEY"
            [[ "$PROD_PUBLIC_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
            HEALTH_URL="https://$PROD_PUBLIC_HOST/health"
            DEPLOY_PATH="${{ vars.PROD_DEPLOY_PATH }}"
          else
            HOST="$DEV_HOST"; SSH_USER="$DEV_SSH_USER"; KEY="$DEV_SSH_KEY"
            HEALTH_URL="$DEV_HEALTH_URL"
            DEPLOY_PATH="${{ vars.DEV_DEPLOY_PATH }}"
            [[ "$HEALTH_URL" == http://* || "$HEALTH_URL" == https://* ]]
          fi
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_PATH must be an absolute safe path" >&2; exit 1; }
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          test -n "$KEY"; test -n "$DEPLOY_KNOWN_HOSTS"
          export HEALTH_URL
          SERVICE_ORIGIN="$(python3 -c 'import os,re; from urllib.parse import urlsplit; p=urlsplit(os.environ["HEALTH_URL"]); assert p.scheme in ("http","https") and p.path=="/health" and not p.query and not p.fragment and not p.username and not p.password and re.fullmatch(r"[A-Za-z0-9.:-]+",p.netloc); print(p.scheme+"://"+p.netloc)')"
          SSH_DIR="$(mktemp -d "$RUNNER_TEMP/memory-ssh.XXXXXXXX")"
          chmod 700 "$SSH_DIR"
          printf '%s' "$KEY" | base64 --decode > "$SSH_DIR/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          # Fail fast with a clear error if the secret lacks a usable host key.
          if ! awk 'NF >= 2 {print $1}' "$SSH_DIR/known_hosts" | grep -qx "$HOST"; then
            echo "DEPLOY_KNOWN_HOSTS does not contain a key for $HOST" >&2
            exit 1
          fi
          {
            printf 'MEMORY_DEPLOY_TARGET=%s@%s\n' "$SSH_USER" "$HOST"
            printf 'MEMORY_SSH_DIR=%s\n' "$SSH_DIR"
            printf 'MEMORY_HEALTH_URL=%s\n' "$HEALTH_URL"
            printf 'MEMORY_SERVICE_ORIGIN=%s\n' "$SERVICE_ORIGIN"
            printf 'MEMORY_DEPLOY_PATH=%s\n' "$DEPLOY_PATH"
          } >> "$GITHUB_ENV"
      - name: Build SHA-tagged application and bootstrap database images
        run: |
          docker build --network host --tag "agent-memory:$RELEASE_SHA" .
          docker build --network host --file docker/db.Dockerfile --tag "agent-memory-db:$RELEASE_SHA" .
      - name: Ship images over the existing VPN/SSH route
        run: |
          set -euo pipefail
          docker save "agent-memory:$RELEASE_SHA" "agent-memory-db:$RELEASE_SHA" | gzip | \
            ssh -i "$MEMORY_SSH_DIR/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$MEMORY_SSH_DIR/known_hosts" "$MEMORY_DEPLOY_TARGET" 'gunzip | docker load'
      - name: Synchronize versioned deployment assets
        run: |
          set -euo pipefail
          SSH="ssh -i $MEMORY_SSH_DIR/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$MEMORY_SSH_DIR/known_hosts"
          $SSH "$MEMORY_DEPLOY_TARGET" "mkdir -p '$MEMORY_DEPLOY_PATH/deploy' '$MEMORY_DEPLOY_PATH/scripts'"
          rsync -az --exclude=.env --exclude=.release --exclude=.previous-release \
            --exclude=.deploying --exclude=.deploy.lock --exclude=__pycache__ \
            -e "$SSH" deploy/ "$MEMORY_DEPLOY_TARGET:$MEMORY_DEPLOY_PATH/deploy/"
          rsync -az --exclude=__pycache__ -e "$SSH" scripts/ "$MEMORY_DEPLOY_TARGET:$MEMORY_DEPLOY_PATH/scripts/"
      - name: Deploy, back up updates and verify authenticated MCP internally
        run: |
          ssh -i "$MEMORY_SSH_DIR/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$MEMORY_SSH_DIR/known_hosts" "$MEMORY_DEPLOY_TARGET" \
            "bash $MEMORY_DEPLOY_PATH/scripts/deploy.sh $DEPLOY_ENVIRONMENT $RELEASE_SHA"
      - name: Verify ingress from the runner
        run: |
          # The target republishes its port when the app container is recreated;
          # allow a short convergence window instead of a single transient probe.
          healthy=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --max-time 5 "$MEMORY_HEALTH_URL" >/dev/null; then
              healthy=1; break
            fi
            sleep 5
          done
          if [[ "$healthy" != 1 ]]; then
            echo "Ingress health check failed for $MEMORY_HEALTH_URL" >&2
            exit 1
          fi
          # Read the owner token over the already-authenticated SSH channel, keep it
          # only in this job's temporary directory, and exercise the published origin
          # from the runner (the target cannot reach its own WireGuard address).
          TOKEN=$(ssh -i "$MEMORY_SSH_DIR/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$MEMORY_SSH_DIR/known_hosts" "$MEMORY_DEPLOY_TARGET" \
            "sed -n 's/^MEMORY_ADMIN_TOKEN=//p' '$MEMORY_DEPLOY_PATH/deploy/$DEPLOY_ENVIRONMENT/.env'")
          if [[ -z "$TOKEN" ]]; then echo "No owner token available for ingress check" >&2; exit 1; fi
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $TOKEN" "$MEMORY_SERVICE_ORIGIN/api/projects" >/dev/null
          umask 177
          printf 'MEMORY_ADMIN_TOKEN=%s\n' "$TOKEN" > "$MEMORY_SSH_DIR/mcp.env"
          docker run --rm --network host --env-file "$MEMORY_SSH_DIR/mcp.env" \
            -e MEMORY_URL="$MEMORY_SERVICE_ORIGIN" "agent-memory:$RELEASE_SHA" \
            python scripts/mcp_smoke.py
          unset TOKEN
      - name: Report actual deployment outcome to the coordinator
        if: always()
        env:
          COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
          COORDINATOR_API_KEY: ${{ secrets.COORDINATOR_API_KEY }}
          DEPLOY_OUTCOME: ${{ job.status }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/report_deployment.py
      - name: Remove temporary SSH credentials
        if: always()
        run: |
          if [[ -n "${MEMORY_SSH_DIR:-}" && "$MEMORY_SSH_DIR" == "$RUNNER_TEMP"/memory-ssh.* ]]; then
            rm -rf -- "$MEMORY_SSH_DIR"
          fi
